<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>46 알림 QA 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--s2:#f9fafb;--line:#e5e8eb;--t1:#191f28;--t2:#4e5968;--t3:#8b95a1;--accent:#3182f6;--accent-soft:#e8f3ff;--p0:#e5383b;--p0-soft:#fdecec;--ok:#0f8a5f;--ok-soft:#e6f6ef;--bad:#d92d20;--bad-soft:#fdecea;--skip:#8a6100;--skip-soft:#fff6db;--dev:#6d28d9;--dev-soft:#f3edff;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--surface:#1b1d22;--s2:#22252b;--line:#2e3138;--t1:#f2f4f6;--t2:#b0b8c1;--t3:#7d8590;--accent:#4c9aff;--accent-soft:#1c2a40;--p0:#ff6b6b;--p0-soft:#3a1d1f;--ok:#4ade80;--ok-soft:#14301f;--bad:#ff7b72;--bad-soft:#3a1d1f;--skip:#facc15;--skip-soft:#352c0f;--dev:#c4b5fd;--dev-soft:#2a2046}}
:root[data-theme="dark"]{--bg:#111317;--surface:#1b1d22;--s2:#22252b;--line:#2e3138;--t1:#f2f4f6;--t2:#b0b8c1;--t3:#7d8590;--accent:#4c9aff;--accent-soft:#1c2a40;--p0:#ff6b6b;--p0-soft:#3a1d1f;--ok:#4ade80;--ok-soft:#14301f;--bad:#ff7b72;--bad-soft:#3a1d1f;--skip:#facc15;--skip-soft:#352c0f;--dev:#c4b5fd;--dev-soft:#2a2046}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.6 "Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--t2);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--t3);font-size:12px}
.bar-p{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;display:flex;margin-top:8px}
.bar-p i{display:block;height:100%}
.prep h2{font-size:16px;margin:0 0 8px}
.prep ul{margin:0;padding-left:18px;color:var(--t2)}
.prep li{margin:3px 0}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.roles span{font-size:12px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--t2)}
.roles b{color:var(--t1)}
.tester{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tester input{flex:1;min-width:160px}
input[type=search],input[type=text],textarea{font:inherit;color:var(--t1);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
.tabs button,.f button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--t2);border-radius:99px;padding:5px 12px;font-size:13px}
.tabs button[aria-pressed=true],.f button[aria-pressed=true]{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f input{flex:1;min-width:180px;padding:6px 10px}
.cnt{color:var(--t3);font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cnt button{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.sec{margin:26px 0 10px}
.sec h2{font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{color:var(--t3);font-weight:400;font-size:13px;white-space:nowrap}
.sec p{margin:2px 0 0;color:var(--t2);font-size:14px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.case.pass{border-left:4px solid var(--ok)}.case.fail{border-left:4px solid var(--bad)}.case.skip{border-left:4px solid var(--skip)}
.hd{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 14px}
.hd .id{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t3);padding-top:3px;min-width:58px}
.hd .ti{flex:1;font-weight:500}
.hd .meta{display:block;color:var(--t3);font-size:12px;font-weight:400;margin-top:2px}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:4px;vertical-align:1px;background:var(--s2);color:var(--t2);border:1px solid var(--line)}
.tg.p0{background:var(--p0-soft);color:var(--p0);border-color:transparent}
.tg.dev{background:var(--dev-soft);color:var(--dev);border-color:transparent}
.st{font-size:12px;font-weight:700;white-space:nowrap;padding-top:2px}
.st.pass{color:var(--ok)}.st.fail{color:var(--bad)}.st.skip{color:var(--skip)}.st.none{color:var(--t3);font-weight:400}
.bd{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.case.open .bd{display:block}
.step{padding:12px 0;border-bottom:1px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.step .who{font-size:12px;color:var(--t3);margin-bottom:4px}
.step dl{margin:0;display:grid;grid-template-columns:44px 1fr;gap:4px 8px;font-size:14px}
.step dt{color:var(--t3);font-weight:500}
.step dd{margin:0;color:var(--t2)}
.chk{list-style:none;margin:8px 0 0;padding:0}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.chk label:hover{background:var(--s2)}
.chk input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--ok)}
.chk input:checked+span{color:var(--t3);text-decoration:line-through}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.res button{border:1px solid var(--line);background:var(--surface);color:var(--t2);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500}
.res button[data-r=pass][aria-pressed=true]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.res button[data-r=fail][aria-pressed=true]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.res button[data-r=skip][aria-pressed=true]{background:var(--skip-soft);color:var(--skip);border-color:var(--skip)}
.res textarea{margin-top:6px;min-height:56px;resize:vertical}
.hint{font-size:12px;color:var(--t3)}
.empty{text-align:center;color:var(--t3);padding:40px 0}
.foot{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap}
.foot button{border:1px solid var(--line);background:var(--surface);color:var(--t1);border-radius:10px;padding:9px 16px;font-weight:500}
.foot button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:600px){.kpi{grid-template-columns:repeat(2,1fr)}.hd .id{min-width:52px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

 <div id="kpi">${kpi()}</div>
 <div class="card prep"><h2>시작 전 준비</h2><ul>
 <li><b>휴대폰 2대 이상</b>을 준비합니다. 알림을 보내는 쪽과 받는 쪽으로 나누어 사용합니다. 가능하면 아이폰과 안드로이드를 한 대씩 준비합니다. 시뮬레이터에서는 앱푸시를 확인할 수 없습니다.</li>
 <li>받는 휴대폰의 <b>알림 권한과 앱 안의 알림 스위치를 모두 켭니다.</b> 테스트 중에는 케이스에서 안내하는 항목만 끕니다.</li>
 <li>리더 A, 멤버 B처럼 표시된 인물마다 사용할 계정을 정합니다. 총 ${DATA.roles.length}개 계정이 필요합니다.</li>
 <li>알림 문구를 비교할 <b>「앱푸시 알림 정본 v26.46.0」 11월 9일판</b>을 준비합니다.</li>
 <li><b><span class="tg dev" style="margin:0">개발 도움</span> 표시가 있는 ${DATA.items.filter(x=>x.dev).length}개 케이스</b>는 개발팀과 함께 준비합니다. 알림 발송이나 이전 버전 앱 설치에 도움이 필요합니다.</li></ul>
 <div class="roles">${DATA.roles.map(r=>`<span><b>${esc(r.k)}</b> ${esc(r.r.join('·'))}</span>`).join('')}</div>
 <h2 style="margin-top:16px">체크 방법</h2><ol style="margin:0;padding-left:20px;color:var(--t2)">
 <li>케이스를 열고 안내된 행동을 순서대로 합니다.</li>
 <li>실제 결과가 각 확인 항목과 일치하면 체크합니다.</li>
 <li>케이스 결과를 <b>통과·실패·확인 못 함</b> 중에서 고릅니다.</li>
 <li>실패했거나 확인하지 못했다면 메모에 실제 결과나 확인하지 못한 이유를 적습니다. 기기명, OS 버전, 사용 계정, 발생 시각도 함께 적습니다.</li></ol>
 <div class="tester"><span class="hint">테스터</span><input type="text" id="tester" aria-label="테스터" placeholder="이름 또는 기기(결과 파일에 함께 남아요)" value="${esc(ST.tester)}"></div>
 <p class="hint" style="margin:8px 0 0">체크와 결과는 현재 브라우저에만 저장됩니다. 테스트를 마치면 아래 <b>「결과 CSV 내려받기」</b>를 눌러 파일을 받아 전달합니다.</p></div>
 <div class="sticky"><div class="tabs">${secs.map(([k,l])=>`<button type="button" data-sec="${k}" aria-pressed="${ST.sec===k}">${esc(l)}</button>`).join('')}</div>
 <div class="f"><button type="button" data-f="core" aria-pressed="${ST.core}">핵심만</button><button type="button" data-f="p0" aria-pressed="${ST.p0}">P0만</button><button type="button" data-f="left" aria-pressed="${ST.left}">남은 것만</button><button type="button" data-f="fail" aria-pressed="${ST.fail}">실패만</button><input type="search" id="q" placeholder="번호·문구 검색" value="${esc(ST.q)}" aria-label="검색"></div>
 <div class="cnt"><span id="cnt"></span><span><button type="button" id="openall">모두 펼치기</button> · <button type="button" id="closeall">모두 접기</button></span></div></div>
 ${ST.core?`<p class="hint" style="margin:14px 0 0">핵심 ${DATA.items.filter(x=>x.core).length}케이스만 보고 있습니다. 새 알림이 오는지, 끄면 오지 않는지를 확인합니다. 알림이 오면 한 번씩 눌러 화면이 제대로 열리는지도 봅니다. 「핵심만」을 끄면 전체 ${DATA.items.length}케이스가 보입니다.</p>`:''}
 <div id="list"></div>
 <div class="foot"><button type="button" class="pri" id="csv">결과 CSV 내려받기</button><button type="button" id="reset">체크 모두 지우기</button></div>`;
 fill();
 document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ST.sec=b.dataset.sec;save();render()});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f;ST[k]=!ST[k];if(k==='left'&&ST.left)ST.fail=false;if(k==='fail'&&ST.fail)ST.left=false;save();render()});
 $('#q').oninput=e=>{ST.q=e.target.value;save();fill()};
 $('#tester').oninput=e=>{ST.tester=e.target.value;save()};
 $('#openall').onclick=()=>document.querySelectorAll('.case').forEach(c=>{c.classList.add('open');c.querySelector('.hd').setAttribute('aria-expanded','true')});
 $('#closeall').onclick=()=>document.querySelectorAll('.case').forEach(c=>{c.classList.remove('open');c.querySelector('.hd').setAttribute('aria-expanded','false')});
 $('#csv').onclick=csv;
 $('#reset').onclick=()=>{if(confirm('이 브라우저에 저장한 체크·결과·메모를 모두 지울까요?')){ST.chk={};ST.res={};ST.memo={};save();render()}};
}
function fill(){
 const its=DATA.items.filter(pass);
 $('#cnt').textContent=`${its.length}케이스 · ${its.reduce((n,x)=>n+x.steps.length,0)}단계`;
 $('#list').innerHTML=listHtml();
}
document.addEventListener('click',e=>{
 const hd=e.target.closest('.hd');if(hd){const c=hd.parentElement;c.classList.toggle('open');hd.setAttribute('aria-expanded',c.classList.contains('open'));return}
 const rb=e.target.closest('.res button');if(rb){const c=rb.closest('.case'),id=c.id.slice(2),k=rb.dataset.r;ST.res[id]=ST.res[id]===k?undefined:k;if(!ST.res[id])delete ST.res[id];save();
  c.className='case open '+(ST.res[id]||'');c.querySelectorAll('.res button').forEach(b=>b.setAttribute('aria-pressed',ST.res[id]===b.dataset.r));
  const st=c.querySelector('.st');st.className='st '+(ST.res[id]||'none');st.textContent=ST.res[id]?RL[ST.res[id]]:'아직';$('#kpi').innerHTML=kpi()}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;if(e.target.checked)ST.chk[k]=1;else delete ST.chk[k];save();
 const c=e.target.closest('.case'),it=DATA.items.find(x=>'c-'+x.id===c.id);c.querySelector('.dn').textContent=done(it)});
document.addEventListener('input',e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m)return;ST.memo[m]=e.target.value;if(!ST.memo[m])delete ST.memo[m];save()});
function csv(){
 const L=[['테스터','케이스','핵심','묶음','기능 영역','제목','P0','OS','결과','확인한 항목','전체 항목','체크 안 한 항목','메모']];
 const sn=Object.fromEntries(DATA.secs.map(s=>[s.k,s.name]));
 DATA.items.forEach(it=>{const miss=[];it.steps.forEach((s,si)=>s.exp.forEach((x,ei)=>{if(!ST.chk[ck(it,si,ei)])miss.push(s.rid+' '+x)}));
  L.push([ST.tester,it.id,it.core?'핵심':'',sn[it.sec],it.area,it.title,it.pri==='P0'?'P0':'',it.os,RL[ST.res[it.id]]||'아직',done(it),total(it),miss.join('\n'),ST.memo[it.id]||''])});
 const t='﻿'+L.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));
 const d=new Date(),p=n=>String(n).padStart(2,'0');a.download=`46_알림QA_결과_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;document.body.appendChild(a);a.click();a.remove();
}
render();
</script>
</body>
</html>
